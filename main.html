
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Apples</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #10e88b;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product {
            display: flex;
            width: 700px;
            max-width: 95%;
            background: white;
            border-radius: 5px;
            padding: 25px;
            gap: 25px;
            position: relative;
        }

        .product__photo {
            width: 50%;
            margin-top: 15px;
            position: relative;
        }

        .photo-container {
            width: 100%;
        }

        .photo-main {
            background: linear-gradient(135deg, #b4ef13, #8dd900);
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .photo-main img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
        }

        .photo-main .share,
        .photo-main .heart {
            position: absolute;
            top: 10px;
            color: white;
            font-size: 18px;
        }

        .photo-main .share {
            left: 10px;
        }

        .photo-main .heart {
            right: 10px;
        }

        .photo-album {
            background: white;
            padding: 15px 10px;
        }

        .photo-album ul {
            display: flex;
            justify-content: center;
            gap: 10px;
            list-style: none;
        }

        .photo-album li {
            border: 1px solid #ddd;
            padding: 4px;
        }

        .photo-album img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .product__info {
            width: 50%;
            padding-top: 15px;
        }

        .title h1 {
            font-size: 22px;
            color: #444;
            margin-bottom: 5px;
        }

        .title span {
            font-size: 10px;
            color: #aaa;
        }

        .price {
            color: #ff3f40;
            font-size: 36px;
            margin: 25px 0;
        }

        .price span {
            font-size: 14px;
        }

        .variant h3,
        .description h3 {
            color: #999;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .variant ul {
            display: flex;
            list-style: none;
            gap: 8px;
            margin-bottom: 25px;
        }

        .variant img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            cursor: pointer;
        }

        .variant li {
            border: 1px solid transparent;
            padding: 3px;
        }

        .variant li:first-child {
            border-color: #ccc;
        }

        .description ul {
            padding-left: 20px;
            font-size: 11px;
            line-height: 1.7;
            color: #555;
        }

        .add-to-cart {
            background-color: #ff3f40;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 5px 12px #ffb6b6;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 0;
            }

            .product {
                flex-direction: column;
                width: 90%;
            }

            .product__photo,
            .product__info {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="product">

        <div class="product__photo">
            <div class="photo-container">

                <div class="photo-main">
                    <span class="share">⌯</span>
                    <span class="heart">♡</span>

                    <img
                        src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
                        alt="Green Delicious Apple">
                </div>

                <div class="photo-album">
                    <ul>
                        <li>
                            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="Green apple view">
                        </li>
                        <li>
                            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png" alt="Yellow apple view">
                        </li>
                        <li>
                            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png" alt="Orange apple view">
                        </li>
                        <li>
                            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png" alt="Red apple view">
                        </li>
                    </ul>
                </div>

            </div>
        </div>

        <div class="product__info">

            <div class="title">
                <h1>Delicious Apples</h1>
                <span>CODE: 459999</span>
            </div>

            <div class="price">
                <span>$</span> 7.93
            </div>

            <div class="variant">
                <h3>SELECT A COLOR</h3>
                <ul>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="Green">
                    </li>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png" alt="Yellow">
                    </li>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png" alt="Orange">
                    </li>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png" alt="Red">
                    </li>
                </ul>
            </div>

            <div class="description">
                <h3>BENEFITS</h3>
                <ul>
                    <li>Apples are nutritious</li>
                    <li>Apples may be good for weight loss</li>
                    <li>Apples may be good for bone health</li>
                    <li>They are linked to a lowest risk of diabetes</li>
                </ul>
            </div>

            <button class="add-to-cart" type="button">ADD TO CART</button>

        </div>

    </main>

</body>
</html>
